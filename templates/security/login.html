<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - JBSON Hardware</title>
    
    <!-- Importing Fonts (Matching Dashboard) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <!-- Include SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        /* CSS Reset & Global Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        :root {
            /* Mismong color variables mula sa Dashboard mo */
            --french-blue: #2F3F7B;
            --mustard: #FFD358;
            --amber-flame: #FFB915;
            --bg-main: #F4F6F9;
            --bg-card: #FFFFFF;
            --primary-red: #891C1C;
            --text-primary: #212529;
            --text-secondary: #6B7280;
            --border-color: #E5E7EB;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            
            /* Dashboard Background Style: Dot Matrix */
            background-color: var(--bg-main);
            background-image: radial-gradient(rgba(47, 63, 123, 0.08) 1.5px, transparent 1.5px);
            background-size: 24px 24px;
            
            position: relative;
            overflow: hidden; 
            color: var(--text-primary);
        }

        /* --- Background Blobs (Enhanced Opacity & Spread) --- */
        .bg-shape {
            position: fixed;
            border-radius: 50%;
            z-index: 0;
            pointer-events: none;
        }
        .shape-1 { 
            width: 500px; height: 500px; 
            background: rgba(255, 211, 88, 0.45); 
            top: -10%; left: 10%; 
            filter: blur(120px); 
        }
        .shape-2 { 
            width: 700px; height: 700px; 
            background: rgba(47, 63, 123, 0.25); 
            bottom: -25%; right: -10%; 
            filter: blur(140px); 
        }
        .shape-3 { 
            width: 400px; height: 400px; 
            background: rgba(255, 185, 21, 0.35); 
            top: 40%; left: -10%; 
            filter: blur(100px); 
        }

        /* --- Header / Logo Section --- */
        .header-logo {
            text-align: center;
            margin-bottom: 25px; /* Brought closer to the card */
            z-index: 10;
            display: flex;
            justify-content: center; 
        }

        .logo-image {
            max-width: 250px; 
            height: auto;
            /* Subtle drop shadow behind the logo to ensure it pops */
            filter: drop-shadow(0px 4px 6px rgba(0, 0, 0, 0.05));
        }

        /* --- Login Card Container (Enhanced for Contrast) --- */
        .card {
            /* Subtle glassmorphism effect */
            background-color: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            
            width: 100%;
            max-width: 440px; /* Slightly wider */
            padding: 45px 40px;
            
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-top: 6px solid var(--french-blue); /* Strong Accent Line */
            
            /* Much stronger layered shadow for floating effect */
            box-shadow: 
                0 25px 50px -12px rgba(47, 63, 123, 0.25),
                0 0 20px rgba(0, 0, 0, 0.03);
            
            z-index: 10;
            position: relative;
        }

        .card-header {
            margin-bottom: 28px;
        }
        .card-header h3 {
            font-size: 26px;
            font-weight: 800;
            color: var(--french-blue);
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }
        .card-header p {
            font-size: 13.5px;
            color: var(--text-secondary);
            font-weight: 500;
            line-height: 1.5;
        }

        /* --- Form Elements --- */
        .form-group {
            margin-bottom: 22px;
            position: relative;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
        }
        .required-asterisk {
            color: var(--primary-red);
        }
        .input-wrapper {
            position: relative;
        }
        .form-control {
            width: 100%;
            padding: 14px 40px 14px 16px; 
            font-size: 14px;
            border: 1px solid #D1D5DB;
            border-radius: 10px;
            outline: none;
            color: var(--text-primary);
            background-color: #F8FAFC;
            transition: all 0.25s ease;
        }
        .form-control::placeholder {
            color: #9CA3AF;
        }
        .form-control:focus {
            border-color: var(--french-blue);
            background-color: #FFFFFF;
            box-shadow: 0 0 0 4px rgba(47, 63, 123, 0.1);
        }
        
        /* Updated Icon Styling */
        .input-icon {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px; 
            color: #9CA3AF;
            transition: color 0.2s;
        }
        .form-control:focus + .input-icon {
            color: var(--french-blue);
        }
        .password-toggle {
            cursor: pointer;
            pointer-events: auto;
        }
        .password-toggle:hover {
            color: var(--french-blue);
        }

        /* Form Options */
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
            font-size: 13px;
        }
        .remember-wrapper {
            display: flex;
            align-items: center;
            color: var(--text-secondary);
            cursor: pointer;
            font-weight: 600;
        }
        .remember-wrapper input[type="checkbox"] {
            appearance: none;
            width: 18px;
            height: 18px;
            border: 1px solid #D1D5DB;
            border-radius: 4px;
            margin-right: 8px;
            cursor: pointer;
            position: relative;
            background-color: #F8FAFC;
            transition: all 0.2s;
        }
        .remember-wrapper input[type="checkbox"]:checked {
            background-color: var(--french-blue);
            border-color: var(--french-blue);
        }
        .remember-wrapper input[type="checkbox"]:checked::after {
            content: '✔';
            color: white;
            position: absolute;
            font-size: 11px;
            left: 3.5px;
            top: 1px;
        }
        .forgot-link {
            color: var(--primary-red);
            text-decoration: none;
            font-weight: 700;
            transition: opacity 0.2s;
        }
        .forgot-link:hover {
            opacity: 0.8;
            text-decoration: underline;
        }

        /* Submit Button */
        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: var(--french-blue);
            color: #FFFFFF;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 10px;
            box-shadow: 0 4px 12px rgba(47, 63, 123, 0.2);
        }
        .btn-submit:hover {
            background-color: #212C59;
            box-shadow: 0 6px 16px rgba(47, 63, 123, 0.3);
            transform: translateY(-1px);
        }
        .btn-submit:active {
            transform: translateY(1px);
            box-shadow: 0 2px 8px rgba(47, 63, 123, 0.2);
        }

        /* Responsive adjustments */
        @media (max-width: 480px) {
            .card {
             margin: 0 20px; 
             padding: 35px 25px; 
            }
            .shape-1 { width: 300px; height: 300px; }
            .shape-2 { width: 400px; height: 400px; }
        }
    </style>
</head>
<body>

    <!-- Background Accents (Matching Dashboard) -->
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>
    <div class="bg-shape shape-3"></div>

    <!-- Logo Section -->
    <div class="header-logo">
    <img 
        src="{% static 'images/jbson-logo.png' %}" 
        alt="JbSon Hardware and Construction Supplies"
        class="logo-image">
    </div>

    <!-- Login Card -->
    <div class="card">
        <div class="card-header">
            <h3>Log In</h3>
            <p>Access the JBSON Hardware panel using your username and password.</p>
        </div>

        <!-- Working Form Structure -->
        <form method="POST" action="">
            {% csrf_token %}

            <div class="form-group">
                <label for="username">Username <span class="required-asterisk">*</span></label>
                <div class="input-wrapper">
                    <input type="text" id="username" name="username" class="form-control" required autocomplete="username" placeholder="Enter your username">
                    <i class="ph ph-envelope input-icon" style="pointer-events: none;"></i>                
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password <span class="required-asterisk">*</span></label>
                <div class="input-wrapper">
                    <input type="password" id="password" name="password" class="form-control" required autocomplete="current-password" placeholder="Enter your password">
                    <i class="ph ph-eye-closed input-icon password-toggle" onclick="togglePassword('password', this)"></i>
                </div>
            </div>

            <div class="form-options">
                <label class="remember-wrapper">
                    <input type="checkbox" name="remember_me">
                    Remember Me
                </label>
                <a href="{% url 'security:forgot_password' %}" class="forgot-link">Forgot Password?</a>        
            </div>

            <button type="submit" class="btn-submit">Sign In</button>
        </form>
    </div>

    <!-- SweetAlert Trigger for Django Messages -->
    {% if messages %}
        <script>
            document.addEventListener("DOMContentLoaded", function() {
                {% for message in messages %}
                    Swal.fire({
                        icon: "{% if message.tags == 'error' %}error{% else %}success{% endif %}",
                        title: "{% if message.tags == 'error' %}Login Failed{% else %}Success!{% endif %}",
                        text: "{{ message|escapejs }}",
                        confirmButtonColor: "#2F3F7B" // Updated to match dashboard French Blue
                    });
                {% endfor %}
            });
        </script>
    {% endif %}

    <!-- JavaScript for Toggle Password -->
    <script>
        function togglePassword(inputId, iconElement) {
            const input = document.getElementById(inputId);
            if (input.type === "password") {
                input.type = "text";
                iconElement.classList.remove("ph-eye-closed");
                iconElement.classList.add("ph-eye");
            } else {
                input.type = "password";
                iconElement.classList.remove("ph-eye");
                iconElement.classList.add("ph-eye-closed");
            }
        }
    </script>

</body>
</html>
