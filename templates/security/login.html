<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - JBSON Hardware</title>
    
    <!-- Importing Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@700&display=swap" rel="stylesheet">
    
    <!-- Pinasok ko ang Phosphor Icons para gumana yung classes na ph-eye at ph-eye-closed -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <!-- Include SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        /* CSS Reset & Global Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(172deg, #FFFFFF 53%, #FDF0F2 53%);
            position: relative;
            overflow: hidden; 
            color: #4A5568;
        }

        /* --- Background Geometric Accents --- */
        .bg-shape-left {
            position: absolute;
            left: -5vw;
            top: 55%;
            width: 30vw;
            height: 35px;
            background-color: #851618;
            transform: rotate(-8deg);
            z-index: 0;
        }
        .bg-shape-left::before {
            content: '';
            position: absolute;
            top: -25px;
            left: 10%;
            width: 80%;
            height: 35px;
            background-color: #851618;
        }
        .bg-shape-left::after {
            content: '';
            position: absolute;
            top: 25px;
            left: 20%;
            width: 90%;
            height: 35px;
            background-color: #851618;
        }

        .bg-shape-right {
            position: absolute;
            right: -5vw;
            top: 45%;
            width: 35vw;
            height: 60px;
            background-color: #0A192F;
            transform: rotate(-8deg);
            z-index: 0;
        }

        /* --- Header / Logo Section --- */
        .header-logo {
            text-align: center;
            margin-bottom: 30px;
            z-index: 10;
            display: flex;
            justify-content: center; 
        }

        .logo-image {
            max-width: 250px; 
            height: auto;
        }

        /* --- Login Card Container --- */
        .card {
            background-color: #FFFFFF;
            width: 100%;
            max-width: 420px;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
            z-index: 10;
        }

        .card-header {
            margin-bottom: 24px;
        }
        .card-header h3 {
            font-size: 24px;
            font-weight: 700;
            color: #1A202C;
            margin-bottom: 8px;
        }
        .card-header p {
            font-size: 12px;
            color: #A0AEC0;
            font-weight: 400;
        }

        /* --- Form Elements --- */
        .form-group {
            margin-bottom: 20px;
            position: relative;
        }
        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #4A5568;
            margin-bottom: 6px;
        }
        .required-asterisk {
            color: #DD5A43;
        }
        .input-wrapper {
            position: relative;
        }
        .form-control {
            width: 100%;
            padding: 12px 40px 12px 14px; 
            font-size: 13px;
            border: 1px solid #E2E8F0;
            border-radius: 6px;
            outline: none;
            color: #1A202C;
            transition: border-color 0.2s ease;
        }
        .form-control::placeholder {
            color: #A0AEC0;
        }
        .form-control:focus {
            border-color: #851618;
        }
        
        /* Updated Icon Styling for Phosphor */
        .input-icon {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px; 
            color: #A0AEC0;
        }
        .password-toggle {
            cursor: pointer;
            pointer-events: auto;
            transition: color 0.2s;
        }
        .password-toggle:hover {
            color: #4A5568;
        }

        /* Form Options */
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            font-size: 12px;
        }
        .remember-wrapper {
            display: flex;
            align-items: center;
            color: #A0AEC0;
            cursor: pointer;
        }
        .remember-wrapper input[type="checkbox"] {
            appearance: none;
            width: 14px;
            height: 14px;
            border: 1px solid #E2E8F0;
            border-radius: 3px;
            margin-right: 8px;
            cursor: pointer;
            position: relative;
            background-color: #FFFFFF;
        }
        .remember-wrapper input[type="checkbox"]:checked {
            background-color: #851618;
            border-color: #851618;
        }
        .remember-wrapper input[type="checkbox"]:checked::after {
            content: '✔';
            color: white;
            position: absolute;
            font-size: 10px;
            left: 2px;
            top: 0px;
        }
        .forgot-link {
            color: #DD5A43;
            text-decoration: none;
            font-weight: 500;
            transition: opacity 0.2s;
        }
        .forgot-link:hover {
            opacity: 0.8;
        }

        /* Submit Button */
        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: #851618;
            color: #FFFFFF;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s ease;
            margin-bottom: 24px;
        }
        .btn-submit:hover {
            background-color: #6a1112;
        }

        /* Responsive adjustments */
        @media (max-width: 480px) {
            .card {
             margin: 0 15px; 
             padding: 25px 15px; 
            }
        }
    </style>
</head>
<body>

    <!-- Background Accents -->
    <div class="bg-shape-left"></div>
    <div class="bg-shape-right"></div>

    <!-- Logo Section -->
    <div class="header-logo">
    <img 
        src="{% static 'images/jbson-logo.png' %}" 
        alt="JbSon Hardware and Construction Supplies"
        class="logo-image">
    </div>

    <!-- Login Card -->
    <div class="card">
        <div class="card-header">
            <h3>Log In</h3>
            <p>Access the JBSON Hardware panel using your email and passcode.</p>
        </div>

        <!-- Working Form Structure -->
        <form method="POST" action="">
            {% csrf_token %}

            <div class="form-group">
                <label for="username">Username <span class="required-asterisk">*</span></label>
                <div class="input-wrapper">
                    <input type="text" id="username" name="username" class="form-control" required autocomplete="username">
                    <i class="ph ph-envelope input-icon" style="pointer-events: none;"></i>                
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password <span class="required-asterisk">*</span></label>
                <div class="input-wrapper">
                    <input type="password" id="password" name="password" class="form-control" required autocomplete="current-password">
                    <i class="ph ph-eye-closed input-icon password-toggle" onclick="togglePassword('password', this)"></i>
                </div>
            </div>

            <div class="form-options">
                <label class="remember-wrapper">
                    <input type="checkbox" name="remember_me">
                    Remember Me
                </label>
                <a href="{% url 'security:forgot_password' %}" class="forgot-link">Forgot Password?</a>        
            </div>

            <button type="submit" class="btn-submit">Sign In</button>
        </form>
    </div>

    <!-- SweetAlert Trigger for Django Messages -->
    {% if messages %}
        <script>
            document.addEventListener("DOMContentLoaded", function() {
                {% for message in messages %}
                    Swal.fire({
                        // Kung error ang tag, magiging 'error' yung icon. Kung iba, 'success'.
                        icon: "{% if message.tags == 'error' %}error{% else %}success{% endif %}",
                        title: "{% if message.tags == 'error' %}Login Failed{% else %}Success!{% endif %}",
                        text: "{{ message|escapejs }}",
                        confirmButtonColor: "#851618"
                    });
                {% endfor %}
            });
        </script>
    {% endif %}

    <!-- JavaScript for Toggle Password -->
    <script>
        function togglePassword(inputId, iconElement) {
            const input = document.getElementById(inputId);
            if (input.type === "password") {
                input.type = "text";
                iconElement.classList.remove("ph-eye-closed");
                iconElement.classList.add("ph-eye");
            } else {
                input.type = "password";
                iconElement.classList.remove("ph-eye");
                iconElement.classList.add("ph-eye-closed");
            }
        }
    </script>

</body>
</html>
