<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - JBSON Hardware</title>
    
    <!-- Importing Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@700&display=swap" rel="stylesheet">

    <style>
        /* CSS Reset & Global Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(172deg, #FFFFFF 53%, #FDF0F2 53%);
            position: relative;
            overflow-x: hidden; 
            padding: 40px 0; /* Added padding for scrolling on shorter screens */
            color: #4A5568;
        }

        /* --- Background Geometric Accents --- */
        .bg-shape-left {
            position: absolute;
            left: -5vw;
            top: 55%;
            width: 30vw;
            height: 35px;
            background-color: #851618;
            transform: rotate(-8deg);
            z-index: 0;
        }
        .bg-shape-left::before {
            content: '';
            position: absolute;
            top: -25px;
            left: 10%;
            width: 80%;
            height: 35px;
            background-color: #851618;
        }
        .bg-shape-left::after {
            content: '';
            position: absolute;
            top: 25px;
            left: 20%;
            width: 90%;
            height: 35px;
            background-color: #851618;
        }

        .bg-shape-right {
            position: absolute;
            right: -5vw;
            top: 45%;
            width: 35vw;
            height: 60px;
            background-color: #0A192F;
            transform: rotate(-8deg);
            z-index: 0;
        }

        /* --- Header / Logo Section --- */
        .header-logo {
            text-align: center;
            margin-bottom: 30px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header-logo h1 {
            font-family: 'Oswald', sans-serif;
            font-size: 36px;
            color: #000000;
            letter-spacing: 1px;
            text-transform: uppercase;
            line-height: 1.1;
            position: relative;
        }
        .header-logo h1 span {
            text-transform: none; 
        }
        .header-logo h2 {
            font-family: 'Oswald', sans-serif;
            font-size: 20px;
            color: #000000;
            letter-spacing: 0.5px;
        }
        
        .hardhat-icon {
            position: absolute;
            top: -12px;
            left: 12px;
            width: 20px;
            fill: #E8751A; 
        }

        /* --- Registration Card Container --- */
        .card {
            background-color: #FFFFFF;
            width: 100%;
            max-width: 420px;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
            z-index: 10;
        }

        .card-header {
            margin-bottom: 24px;
        }
        .card-header h3 {
            font-size: 24px;
            font-weight: 700;
            color: #1A202C;
            margin-bottom: 8px;
        }
        .card-header p {
            font-size: 12px;
            color: #A0AEC0;
            font-weight: 400;
        }

        /* --- Django Error Messages Logic --- */
        .error-message {
            background-color: #FDF0F2; 
            color: #851618; 
            border: 1px solid #DD5A43; 
            font-size: 13px;
            font-weight: 500;
            text-align: center;
            margin-bottom: 20px;
            padding: 10px;
            border-radius: 6px;
        }

        /* --- Form Elements --- */
        .form-group {
            margin-bottom: 16px; /* Slightly tighter for register page */
            position: relative;
        }
        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #4A5568;
            margin-bottom: 6px;
        }
        .required-asterisk {
            color: #DD5A43;
        }
        .input-wrapper {
            position: relative;
        }
        .form-control {
            width: 100%;
            padding: 12px 40px 12px 14px; 
            font-size: 13px;
            border: 1px solid #E2E8F0;
            border-radius: 6px;
            outline: none;
            color: #1A202C;
            transition: border-color 0.2s ease;
        }
        .form-control::placeholder {
            color: #A0AEC0;
        }
        .form-control:focus {
            border-color: #851618;
        }
        
        .input-icon {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            color: #A0AEC0;
            pointer-events: none; 
        }
        .password-toggle {
            cursor: pointer;
            pointer-events: auto;
        }

        /* Terms and Privacy Checkbox */
        .terms-wrapper {
            display: flex;
            align-items: center;
            font-size: 12px;
            color: #A0AEC0;
            margin-bottom: 24px;
            margin-top: 20px;
        }
        .terms-wrapper input[type="checkbox"] {
            appearance: none;
            width: 14px;
            height: 14px;
            border: 1px solid #E2E8F0;
            border-radius: 3px;
            margin-right: 8px;
            cursor: pointer;
            position: relative;
            background-color: #FFFFFF;
        }
        .terms-wrapper input[type="checkbox"]:checked {
            background-color: #851618;
            border-color: #851618;
        }
        .terms-wrapper input[type="checkbox"]:checked::after {
            content: '✔';
            color: white;
            position: absolute;
            font-size: 10px;
            left: 2px;
            top: 0px;
        }
        .terms-link {
            color: #DD5A43;
            text-decoration: none;
            font-weight: 500;
        }
        .terms-link:hover {
            text-decoration: underline;
        }

        /* Submit Button */
        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: #851618;
            color: #FFFFFF;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s ease;
            margin-bottom: 24px;
        }
        .btn-submit:hover {
            background-color: #6a1112;
        }

        /* Footer Link */
        .card-footer {
            text-align: left;
            font-size: 12px;
            color: #A0AEC0;
        }
        .card-footer a {
            color: #4A5568;
            text-decoration: none;
            font-weight: 600;
        }
        .card-footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .card {
                margin: 0 20px;
                padding: 30px 20px;
            }
            .header-logo h1 {
                font-size: 28px;
            }
            .header-logo h2 {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

    <!-- Background Accents -->
    <div class="bg-shape-left"></div>
    <div class="bg-shape-right"></div>

    <!-- Logo Section -->
    <div class="header-logo">
        <h1>
            <svg class="hardhat-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2C8.13 2 5 5.13 5 9v2H4v2h16v-2h-1V9c0-3.87-3.13-7-7-7zm0 2c2.76 0 5 2.24 5 5v2H7V9c0-2.76 2.24-5 5-5z"/>
                <path d="M2 14h20v2H2z"/>
            </svg>
            J<span style="text-transform: lowercase;">b</span>Son HARDWARE
        </h1>
        <h2>AND CONSTRUCTION SUPPLIES</h2>
    </div>

    <!-- Registration Card -->
    <div class="card">
        <div class="card-header">
            <h3>Register</h3>
            <!-- Exact subtitle from Image 3 -->
            <p>Create New Account</p>
        </div>

        <!-- DJANGO LOGIC INJECTED HERE -->
        {% if messages %}
            <div class="error-message">
                {% for message in messages %}
                    {{ message }}<br>
                {% endfor %}
            </div>
        {% endif %}

        <!-- Working Form Structure -->
        <form method="POST" action="">
            {% csrf_token %}

            <div class="form-group">
                <label for="name">Name <span class="required-asterisk">*</span></label>
                <div class="input-wrapper">
                    <input type="text" id="name" name="name" class="form-control" required autocomplete="name">
                    <!-- User Icon SVG -->
                    <svg class="input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                </div>
            </div>

            <div class="form-group">
                <label for="username">Username <span class="required-asterisk">*</span></label>
                <div class="input-wrapper">
                    <input type="text" id="username" name="username" class="form-control" required autocomplete="username">
                    <!-- Mail Icon SVG -->
                    <svg class="input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password <span class="required-asterisk">*</span></label>
                <div class="input-wrapper">
                    <input type="password" id="password" name="password" class="form-control" required autocomplete="new-password">
                    <!-- Eye Slash Icon SVG -->
                    <svg class="input-icon password-toggle" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"></path></svg>
                </div>
            </div>

            <div class="form-group">
                <label for="confirm_password">Confirm Password <span class="required-asterisk">*</span></label>
                <div class="input-wrapper">
                    <input type="password" id="confirm_password" name="confirm_password" class="form-control" required autocomplete="new-password">
                    <!-- Eye Slash Icon SVG -->
                    <svg class="input-icon password-toggle" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"></path></svg>
                </div>
            </div>

            <label class="terms-wrapper">
                <input type="checkbox" name="terms" required>
                I agree to the &nbsp;<a href="#" class="terms-link">Terms & Privacy</a>
            </label>

            <button type="submit" class="btn-submit">Sign Up</button>
        </form>

        <div class="card-footer">
            Already have an account? <!-- Update href to {% url 'login' %} --> <a href="#">Log In Instead</a>
        </div>
    </div>

</body>
</html>
