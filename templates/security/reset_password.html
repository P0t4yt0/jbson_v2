<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - JBSON Hardware</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@700&display=swap" rel="stylesheet">
    
    <!-- Google reCAPTCHA API -->
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: linear-gradient(172deg, #FFFFFF 53%, #FDF0F2 53%); position: relative; overflow: hidden; color: #4A5568; }
        
        .bg-shape-left { position: absolute; left: -5vw; top: 55%; width: 30vw; height: 35px; background-color: #851618; transform: rotate(-8deg); z-index: 0; }
        .bg-shape-left::before { content: ''; position: absolute; top: -25px; left: 10%; width: 80%; height: 35px; background-color: #851618; }
        .bg-shape-left::after { content: ''; position: absolute; top: 25px; left: 20%; width: 90%; height: 35px; background-color: #851618; }
        .bg-shape-right { position: absolute; right: -5vw; top: 45%; width: 35vw; height: 60px; background-color: #0A192F; transform: rotate(-8deg); z-index: 0; }

        .header-logo { text-align: center; margin-bottom: 30px; z-index: 10; display: flex; flex-direction: column; align-items: center; }
        .header-logo h1 { font-family: 'Oswald', sans-serif; font-size: 36px; color: #000000; letter-spacing: 1px; text-transform: uppercase; line-height: 1.1; position: relative; }
        .header-logo h1 span { text-transform: none; }
        .header-logo h2 { font-family: 'Oswald', sans-serif; font-size: 20px; color: #000000; letter-spacing: 0.5px; }
        .hardhat-icon { position: absolute; top: -12px; left: 12px; width: 20px; fill: #E8751A; }

        .card { background-color: #FFFFFF; width: 100%; max-width: 420px; padding: 40px; border-radius: 10px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06); z-index: 10; }
        .card-header { margin-bottom: 24px; text-align: center; }
        .card-header h3 { font-size: 24px; font-weight: 700; color: #1A202C; margin-bottom: 8px; }
        .card-header p { font-size: 13px; color: #A0AEC0; font-weight: 400; line-height: 1.5; }

        .error-message, .success-message { font-size: 13px; font-weight: 500; text-align: center; margin-bottom: 20px; padding: 10px; border-radius: 6px; }
        .error-message { background-color: #FDF0F2; color: #851618; border: 1px solid #DD5A43; }
        .success-message { background-color: #F0FDF4; color: #166534; border: 1px solid #22C55E; }

        .form-group { margin-bottom: 20px; position: relative; }
        .form-group label { display: block; font-size: 14px; font-weight: 500; color: #4A5568; margin-bottom: 6px; }
        .form-control { width: 100%; padding: 12px 40px 12px 14px; font-size: 13px; border: 1px solid #E2E8F0; border-radius: 6px; outline: none; color: #1A202C; transition: border-color 0.2s ease; }
        .form-control::placeholder { color: #A0AEC0; }
        .form-control:focus { border-color: #851618; }
        .input-icon { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: #A0AEC0; pointer-events: none; }

        .btn-submit { width: 100%; padding: 12px; background-color: #851618; color: #FFFFFF; border: none; border-radius: 6px; font-size: 14px; font-weight: 500; cursor: pointer; transition: background-color 0.2s ease; margin-bottom: 16px; }
        .btn-submit:hover { background-color: #6a1112; }

        .card-footer { text-align: center; font-size: 12px; color: #A0AEC0; margin-top: 10px; }
        .card-footer a { color: #851618; text-decoration: none; font-weight: 600; }
        .card-footer a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="bg-shape-left"></div>
    <div class="bg-shape-right"></div>

    <div class="header-logo">
        <h1>
            <svg class="hardhat-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 2C8.13 2 5 5.13 5 9v2H4v2h16v-2h-1V9c0-3.87-3.13-7-7-7zm0 2c2.76 0 5 2.24 5 5v2H7V9c0-2.76 2.24-5 5-5z"/><path d="M2 14h20v2H2z"/></svg>
            J<span style="text-transform: lowercase;">b</span>Son HARDWARE
        </h1>
        <h2>AND CONSTRUCTION SUPPLIES</h2>
    </div>

    <div class="card">
        
        <!-- Django Messages Placeholder -->
        {% if messages %}
            {% for message in messages %}
                <div class="{% if message.tags == 'error' %}error-message{% else %}success-message{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <div class="card-header">
            <h3>Reset Password</h3>
            <p>Please enter your new password below.</p>
        </div>

        <form method="POST" action="">
            {% csrf_token %}
            
            <!-- ITO ANG MISSING PIECE PARA GUMANA ANG SAVE -->
            <input type="hidden" name="action" value="set_password">
            
            <div class="form-group">
                <label>New Password</label>
                <div style="position: relative;">
                    <input type="password" name="new_password" class="form-control" required placeholder="Enter new password">
                    <svg class="input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                </div>
            </div>

            <div class="form-group">
                <label>Confirm New Password</label>
                <div style="position: relative;">
                    <input type="password" name="confirm_password" class="form-control" required placeholder="Confirm new password">
                    <svg class="input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>
                </div>
            </div>

            <button type="submit" class="btn-submit">Reset Password</button>
        </form>

        <div class="card-footer">
            <a href="{% url 'security:login' %}">&larr; Back to Login</a>
        </div>
    </div>

</body>
</html>
