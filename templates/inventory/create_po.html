{% extends 'dashboard/dashboard.html' %}
{% block content %}

<style>
    
    .po-container { max-width: 1200px; margin: 0 auto; padding: 25px; }
    .card { background: white; border-radius: 12px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.03); border: 1px solid #E2E8F0; margin-bottom: 20px; }
    
    .header-section h2 { margin: 0; color: #1A365D; font-weight: 800; }
    .header-section p { color: #718096; margin-top: 5px; font-size: 14px; }
    
    .form-row { display: flex; gap: 20px; margin-bottom: 20px; }
    .form-group { flex: 1; }
    .form-group label { display: block; font-weight: 700; margin-bottom: 8px; font-size: 13px; color: #1A365D; text-transform: uppercase; letter-spacing: 0.5px; }
    .form-group input, .form-group select { width: 100%; padding: 12px; border: 2px solid #E2E8F0; border-radius: 8px; outline: none; font-size: 14px; transition: 0.2s; box-sizing: border-box; }
    .form-group input:focus, .form-group select:focus { border-color: #0D9488; background: #F0FDFA; }

    /* Dynamic Table Styles */
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th { text-align: left; padding: 15px; color: #4A5568; border-bottom: 2px solid #1A365D; font-size: 13px; font-weight: 700; }
    td { padding: 10px 15px; border-bottom: 1px dashed #E2E8F0; vertical-align: middle; }
    
    .item-input { width: 100%; padding: 10px; border: 1px solid #CBD5E0; border-radius: 6px; outline: none; }
    .number-input { width: 100px; padding: 10px; border: 1px solid #CBD5E0; border-radius: 6px; outline: none; text-align: right; }
    .subtotal-text { font-weight: 700; color: #1A365D; font-size: 15px; }
    
    .btn-add { background: #EDF2F7; color: #1A365D; padding: 10px 15px; border-radius: 8px; border: 1px dashed #A0AEC0; font-weight: 700; cursor: pointer; transition: 0.2s; width: 100%; margin-top: 15px; }
    .btn-add:hover { background: #E2E8F0; border-color: #1A365D; }
    
    .btn-remove { background: #FFF5F5; color: #E53E3E; border: 1px solid #FED7D7; width: 32px; height: 32px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    
    .grand-total-box { background: #F8FAFC; padding: 20px; border-radius: 8px; border: 1px solid #E2E8F0; display: flex; justify-content: space-between; align-items: center; margin-top: 20px; }
    .grand-total-text { font-size: 24px; font-weight: 800; color: #0D9488; margin: 0; }
    
    .btn-submit { background: #0D9488; color: white; padding: 15px 30px; border-radius: 8px; border: none; font-weight: 800; font-size: 16px; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 10px rgba(13, 148, 136, 0.2); }
    .btn-submit:hover { background: #0F766E; transform: translateY(-2px); }
</style>

<div class="po-container">
    <div class="header-section" style="margin-bottom: 25px;">
        <h2>Create Purchase Order</h2>
        <p>Draft a new order request to send to your suppliers.</p>
    </div>

    <form method="POST" action="{% url 'inventory:create_po' %}">
        {% csrf_token %}
        
        <div class="card">
            <div class="form-row">
                <div class="form-group" style="flex: 2;">
                    <label>Select Supplier *</label>
                    <select name="supplier" required>
                        <option value="">-- Choose a Supplier --</option>
                        {% for supplier in suppliers %}
                            <option value="{{ supplier.id }}">{{ supplier.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label>Expected Delivery Date</label>
                    <input type="date" name="expected_delivery">
                </div>
            </div>
        </div>

        <div class="card">
            <label style="display: block; font-weight: 800; font-size: 16px; color: #1A365D; margin-bottom: 10px;">Order Items</label>
            
            <table id="po-table">
                <thead>
                    <tr>
                        <th style="width: 45%;">Hardware Product</th>
                        <th style="width: 15%;">Quantity</th>
                        <th style="width: 20%;">Unit Cost (₱)</th>
                        <th style="width: 15%; text-align: right;">Subtotal</th>
                        <th style="width: 5%;"></th>
                    </tr>
                </thead>
                <tbody id="po-body">
                    <tr>
                        <td>
                            <select name="product_id[]" class="item-input" required onchange="autoFillCost(this)">
                                <option value="">Select Item...</option>
                                {% for item in products %}
                                    <option value="{{ item.id }}" data-cost="{{ item.unit_cost }}">{{ item.product_id }} - {{ item.item_name }}</option>
                                {% endfor %}
                            </select>
                        </td>
                        <td><input type="number" name="quantity[]" class="number-input qty-field" min="1" value="1" required oninput="calculateRow(this)"></td>
                        <td><input type="number" name="unit_cost[]" class="number-input cost-field" step="0.01" value="0.00" required oninput="calculateRow(this)"></td>
                        <td style="text-align: right;"><span class="subtotal-text">₱0.00</span></td>
                        <td><button type="button" class="btn-remove" onclick="removeRow(this)">x</button></td>
                    </tr>
                </tbody>
            </table>
            
            <button type="button" class="btn-add" onclick="addRow()">+ Add Another Item</button>

            <div class="grand-total-box">
                <span style="font-weight: 700; color: #4A5568; font-size: 16px; text-transform: uppercase;">Estimated Grand Total</span>
                <h3 class="grand-total-text" id="grand-total">₱0.00</h3>
            </div>
        </div>

        <div style="text-align: right;">
            <a href="{% url 'inventory:supplier_list' %}" style="color: #718096; text-decoration: none; font-weight: 600; margin-right: 20px;">Cancel</a>
            <button type="submit" class="btn-submit">Generate Purchase Order</button>
        </div>
    </form>
</div>

<script>
    // Grab the first row so we can clone it easily later
    const defaultRowHTML = document.getElementById('po-body').innerHTML;

    function addRow() {
        const tbody = document.getElementById('po-body');
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td>
                <select name="product_id[]" class="item-input" required onchange="autoFillCost(this)">
                    <option value="">Select Item...</option>
                    {% for item in products %}
                        <option value="{{ item.id }}" data-cost="{{ item.unit_cost }}">{{ item.product_id }} - {{ item.item_name }}</option>
                    {% endfor %}
                </select>
            </td>
            <td><input type="number" name="quantity[]" class="number-input qty-field" min="1" value="1" required oninput="calculateRow(this)"></td>
            <td><input type="number" name="unit_cost[]" class="number-input cost-field" step="0.01" value="0.00" required oninput="calculateRow(this)"></td>
            <td style="text-align: right;"><span class="subtotal-text">₱0.00</span></td>
            <td><button type="button" class="btn-remove" onclick="removeRow(this)">x</button></td>
        `;
        tbody.appendChild(tr);
    }

    function removeRow(btn) {
        // Prevent deleting if it's the last row
        if(document.querySelectorAll('#po-body tr').length > 1) {
            btn.closest('tr').remove();
            calculateGrandTotal();
        }
    }

    function autoFillCost(selectElement) {
        const row = selectElement.closest('tr');
        const costInput = row.querySelector('.cost-field');
        
        // Grab the data-cost from the selected option
        const selectedOption = selectElement.options[selectElement.selectedIndex];
        const cost = selectedOption.getAttribute('data-cost');
        
        if(cost) {
            costInput.value = parseFloat(cost).toFixed(2);
            calculateRow(costInput);
        }
    }

    function calculateRow(element) {
        const row = element.closest('tr');
        const qty = parseFloat(row.querySelector('.qty-field').value) || 0;
        const cost = parseFloat(row.querySelector('.cost-field').value) || 0;
        
        const subtotal = qty * cost;
        row.querySelector('.subtotal-text').innerText = "₱" + subtotal.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
        
        calculateGrandTotal();
    }

    function calculateGrandTotal() {
        let grandTotal = 0;
        document.querySelectorAll('#po-body tr').forEach(row => {
            const qty = parseFloat(row.querySelector('.qty-field').value) || 0;
            const cost = parseFloat(row.querySelector('.cost-field').value) || 0;
            grandTotal += (qty * cost);
        });
        
        document.getElementById('grand-total').innerText = "₱" + grandTotal.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
    }
</script>

{% endblock %}
